<!DOCTYPE html>
<html>
<head>
    <title>Face Authentication Test</title>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        video {
            width: 640px;
            max-width: 90%;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            margin-top: 20px;
            cursor: pointer;
        }

        #status {
            margin: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Face Authentication Test</h2>

    <video id="video" autoplay muted></video>

    <br>

    <div style="margin-top:18px;">
        <label style="display:block;margin-bottom:6px">Name (required)</label>
        <input id="name" type="text" style="padding:8px;width:280px" />
    </div>

    <div style="margin-top:12px;">
        <label style="display:block;margin-bottom:6px">Email (required)</label>
        <input id="email" type="email" style="padding:8px;width:280px" />
    </div>

    <div style="margin-top:12px;">
        <label style="display:block;margin-bottom:6px">Phone</label>
        <input id="phone" type="text" style="padding:8px;width:280px" />
    </div>

    <div style="margin-top:12px;">
        <label style="display:block;margin-bottom:6px">Password (required)</label>
        <input id="password" type="password" style="padding:8px;width:280px" />
    </div>

    <div style="margin-top:14px">
        <button onclick="captureFace()">Capture Face</button>
        <button onclick="registerFace()" style="margin-left:10px">Register Face</button>
        <button onclick="loginFace()" style="margin-left:10px">Login with Face</button>
    </div>

    <p id="status">Loading models...</p>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');

        async function start() {
            try {
                status.innerText = "Loading face models...";

                await faceapi.nets.tinyFaceDetector.loadFromUri('/models');
                await faceapi.nets.faceLandmark68Net.loadFromUri('/models');
                await faceapi.nets.faceRecognitionNet.loadFromUri('/models');

                status.innerText = "Models loaded. Starting camera...";

                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;

                status.innerText = "Camera ready ✅";
            } catch (error) {
                console.error(error);
                status.innerText = "Error: " + error.message;
            }
        }

        async function captureFace() {
            status.innerText = "Detecting face...";

            const result = await faceapi
                .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (!result) {
                status.innerText = "❌ No face detected";
                return;
            }

            const descriptor = Array.from(result.descriptor);
            console.log("Face descriptor:", descriptor);
            status.innerText = "Face detected successfully ✅";
            console.log("Descriptor length:", descriptor.length);
        }

        start();
        
        async function registerFace() {
            status.innerText = 'Preparing registration...';

            // Validate inputs
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            if (!name || !email || !password) {
                status.innerText = 'Please fill Name, Email, and Password.';
                return;
            }

            status.innerText = 'Detecting face for registration...';

            const result = await faceapi
                .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (!result) {
                status.innerText = '❌ No face detected. Please position your face and try again.';
                return;
            }

            const descriptor = Array.from(result.descriptor);

            status.innerText = 'Registering user...';

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, phone, password, descriptor })
                });

                const data = await res.json();

                if (res.ok) {
                    status.innerText = data.message || 'User registered successfully!';
                } else {
                    status.innerText = data.message || 'Registration failed';
                }

            } catch (err) {
                console.error(err);
                status.innerText = 'Registration request failed: ' + err.message;
            }
        }

        async function loginFace() {
            status.innerText = 'Preparing login...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                status.innerText = 'Please enter Email and Password to login.';
                return;
            }

            status.innerText = 'Detecting face for login...';

            const result = await faceapi
                .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptor();

            if (!result) {
                status.innerText = '❌ No face detected. Please position your face and try again.';
                return;
            }

            const descriptor = Array.from(result.descriptor);

            status.innerText = 'Sending login request...';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, descriptor })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    status.innerText = data.message || 'Login successful';
                } else {
                    status.innerText = data.message || 'Login failed';
                }

            } catch (err) {
                console.error(err);
                status.innerText = 'Login request failed: ' + err.message;
            }
        }
    </script>

</body>
</html>
